name: census
# The daily genome census of the public estate, on GitHub's runner: every public repository's seed.json, and the full
# birth check on a fresh clone of each one that declares a genome. It reads only the public API, so anyone can re-run it.
on:
  schedule: [{ cron: '17 5 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: census of the public estate
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node scripts/census.mjs --public-only
      - name: publish the census
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/census.json data/genome-index.json data/census-history.json data/census-cache.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "census $(date -u +%F) [skip ci]" && git push; fi
